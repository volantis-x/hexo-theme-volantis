name: Deploy EdgeOne-Pages Incremental for Fork

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 检出仓库
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2️⃣ 设置 Git 用户
      - name: Set up Git
        run: |
          git config user.name "shimoxijimu-actions"
          git config user.email "shimoxijimu@users.noreply.github.com"

      # 3️⃣ 增量部署 EdgeOne-Pages
      - name: Deploy only changed __config.yml to EdgeOne-Pages
        run: |
          BRANCH="EdgeOne-Pages"

          # 创建或切换分支
          if git show-ref --verify --quiet refs/heads/$BRANCH; then
            git checkout $BRANCH
          else
            git checkout -b $BRANCH
          fi

          # 只同步 EdgeOne__config.yml
          SRC="deploy/EdgeOne__config.yml"
          DEST="__config.yml"

          if ! cmp -s "$SRC" "$DEST" 2>/dev/null; then
            echo "Updating $DEST from $SRC..."
            cp "$SRC" "$DEST"
            git add "$DEST"
          else
            echo "$DEST unchanged."
          fi

          # 提交并推送变化
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Incremental update for $BRANCH from main"
            git push https://x-access-token:${{ secrets.PERSONAL_TOKEN }}@github.com/${{ github.repository }} $BRANCH
          fi
