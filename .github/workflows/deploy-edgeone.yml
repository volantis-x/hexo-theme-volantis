name: Deploy EdgeOne-Pages Incremental from Deploy Directory

on:
  push:
    branches:
      - 6.0

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 检出仓库
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2️⃣ 设置 Git 用户
      - name: Set up Git
        run: |
          git config user.name "shimoxijimu-actions"
          git config user.email "shimoxijimu@users.noreply.github.com"

      # 3️⃣ 增量部署 EdgeOne-Pages
      - name: Deploy EdgeOne__config.yml to EdgeOne-Pages
        run: |
          # 检查是否有 PERSONAL_TOKEN
          if [[ -z "${{ secrets.PERSONAL_TOKEN }}" ]]; then
            echo "Warning: PERSONAL_TOKEN not found. Please set PERSONAL_TOKEN in repository secrets to enable deployment."
            echo "Skipping deployment..."
            exit 0
          fi
          BRANCH="EdgeOne-Pages"

          # 创建或切换分支
          if git show-ref --verify --quiet refs/heads/$BRANCH; then
            git checkout $BRANCH
          else
            git checkout -b $BRANCH
          fi

          # 同步 EdgeOne__config.yml 文件
          SRC="deploy/EdgeOne__config.yml"
          DEST="__config.yml"

          if [[ -f "$SRC" ]]; then
            if ! cmp -s "$SRC" "$DEST" 2>/dev/null; then
              echo "Updating $DEST from $SRC..."
              cp "$SRC" "$DEST"
              git add "$DEST"
              git commit -m "Update __config.yml from 6.0 branch"
              git push https://x-access-token:${{ secrets.PERSONAL_TOKEN }}@github.com/${{ github.repository }} $BRANCH
              echo "Changes committed and pushed to $BRANCH branch."
            else
              echo "$DEST unchanged, no update needed."
            fi
          else
            echo "Error: Source file $SRC not found."
            exit 1
          fi
