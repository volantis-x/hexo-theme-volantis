name: Sync 6.0 Branch Changes to EdgeOne-Pages

on:
  push:
    branches:
      - 6.0

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 检出仓库
      - name: Checkout 6.0 branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_TOKEN }}

      # 2️⃣ 设置 Git 用户
      - name: Set up Git
        run: |
          git config user.name "shimoxijimu-actions"
          git config user.email "shimoxijimu@users.noreply.github.com"

      # 3️⃣ 同步 6.0 分支内容到 EdgeOne-Pages
      - name: Sync 6.0 branch to EdgeOne-Pages
        run: |
          # 检查是否有 PERSONAL_TOKEN
          if [[ -z "${{ secrets.PERSONAL_TOKEN }}" ]]; then
            echo "Warning: PERSONAL_TOKEN not found. Please set PERSONAL_TOKEN in repository secrets to enable deployment."
            echo "Skipping deployment..."
            exit 0
          fi
          
          echo "Starting sync process..."
          BRANCH="EdgeOne-Pages"

          # 获取原始提交信息和ID
          ORIGINAL_COMMIT_MSG=$(git log --format=%B -n 1 ${{ github.sha }})
          COMMIT_ID=$(echo ${{ github.sha }} | cut -c1-7)
          
          # 检查远程分支是否存在
          if git ls-remote --exit-code --heads origin $BRANCH >/dev/null 2>&1; then
            echo "Remote branch $BRANCH exists, fetching..."
            git fetch origin $BRANCH
            git checkout -B $BRANCH origin/$BRANCH
          else
            echo "Remote branch $BRANCH does not exist, creating new branch..."
            git checkout -b $BRANCH
          fi

          echo "Current branch: $(git branch --show-current)"

          # 第一步：强制同步 6.0 分支的所有内容
          echo "Step 1: Force syncing all content from 6.0 branch..."
          echo "Resetting EdgeOne-Pages branch to match 6.0 branch exactly..."
          git reset --hard origin/6.0
          echo "✅ Content force synced from 6.0 branch."

          # 第二步：复制 deploy 文件夹下的文件到根目录
          echo "Step 2: Copying files from deploy/ directory to root..."
          DEPLOY_DIR="deploy"
          
          if [[ -d "$DEPLOY_DIR" ]]; then
            echo "Deploy directory found, copying files..."
            
            # 显示 deploy 目录内容
            echo "Files in deploy directory:"
            ls -la "$DEPLOY_DIR"
            
            # 复制 deploy 目录下的所有文件到根目录（覆盖同名文件）
            if ls "$DEPLOY_DIR"/* >/dev/null 2>&1; then
              cp -rf "$DEPLOY_DIR"/* . 
              echo "Copied regular files from deploy directory"
            fi
            
            # 复制隐藏文件
            if ls "$DEPLOY_DIR"/.[^.]* >/dev/null 2>&1; then
              cp -rf "$DEPLOY_DIR"/.[^.]* .
              echo "Copied hidden files from deploy directory"
            fi
            
            # 显示当前目录状态
            echo "Current directory status:"
            git status --porcelain
            
            # 添加所有变更到暂存区
            git add .
            
            # 检查是否有变更需要提交
            if ! git diff --cached --quiet; then
              echo "Committing deploy files..."
              git commit -m "${ORIGINAL_COMMIT_MSG} + Deploy files (${COMMIT_ID})"
              echo "✅ Deploy files committed."
            else
              echo "ℹ️ No deploy files changes to commit."
            fi
          else
            echo "Deploy directory not found, skipping deploy files copy."
          fi

          # 强制推送到远程仓库
          echo "Force pushing changes to remote..."
          git push --force https://x-access-token:${{ secrets.PERSONAL_TOKEN }}@github.com/${{ github.repository }} $BRANCH
          echo "✅ Changes force pushed to $BRANCH branch successfully."
          
          # 通知主仓库子模块已更新
          echo "Triggering main repository update..."
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.PERSONAL_TOKEN }}" \
            -H "User-Agent: GitHub-Actions" \
            https://api.github.com/repos/shimoxi123/blog-hexo/dispatches \
            -d '{"event_type":"submodule-updated","client_payload":{"submodule":"themes/volantis","branch":"EdgeOne-Pages"}}' \
            || echo "Failed to trigger main repository update"
          
          echo "🎉 Sync process completed!"
