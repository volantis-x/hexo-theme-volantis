name: release-please
on:
  push:
    branches: [  ]
  workflow_dispatch:

jobs:
  release-please:
    if: github.repository == 'volantis-x/hexo-theme-volantis'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v3
        with:
          release-type: node
          package-name: hexo-theme-volantis
          include-v-in-tag: false
          default-branch: 6.x

  
